name: Scheduled Skill Governance Review
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Create report directory
        run: mkdir -p reports
      - name: Structural health report
        run: python scripts/skill_health.py --json > reports/skill-health.json
      - name: Portfolio overlap, freshness, and usage report
        run: |
          python scripts/skill_portfolio_report.py --format markdown --output reports/skill-portfolio-review.md
          python scripts/skill_portfolio_report.py --format json --output reports/skill-portfolio-review.json
      - name: Offline dependency inventory
        run: |
          python scripts/dependency_watch.py inventory --format markdown --output reports/dependency-inventory.md
          python scripts/dependency_watch.py inventory --format json --output reports/dependency-inventory.json
      - name: Check public dependency and interface contracts
        id: remote-watch
        continue-on-error: true
        run: python scripts/dependency_watch.py check --strict --format markdown --output reports/dependency-watch.md
      - name: Add review summary
        if: always()
        run: |
          for file in reports/skill-portfolio-review.md reports/dependency-watch.md; do
            if [ -f "$file" ]; then
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
              printf "\n\n" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "\${{ steps.remote-watch.outcome }}" = "failure" ]; then
            echo "::warning::A watched public dependency or interface source changed or could not be reached. Inspect the report artifact."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-governance-review-\${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
